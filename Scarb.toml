[package]
name = "off_chain_signature"
version = "0.3.0"
edition = "2024_07"

[[target.starknet-contract]]
sierra = true

[dependencies]
starknet = "2.11.4"

[dev-dependencies]
cairo_test = "2.11.4"

[scripts]
SimpleStruct = "node --loader ts-node/esm scripts/SimpleStruct.ts"
StructWithArray = "node --loader ts-node/esm scripts/StructWithArray.ts"
StructWithMerkletree = "node --loader ts-node/esm scripts/StructWithMerkletree.ts"
StructWithU256 = "node --loader ts-node/esm scripts/StructWithU256.ts"
StructWithString = "node --loader ts-node/esm scripts/StructWithString.ts"
format = "scarb fmt && npx prettier --write ."